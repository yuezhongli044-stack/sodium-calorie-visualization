<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel D Interactive</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <style>
    :root {
      --line: #c8d1de;
      --text: #1f2937;
      --muted: #5f6b7a;
      --accent: #2c6fb3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: linear-gradient(180deg, #dce5f1 0%, #d4dfec 100%);
      color: var(--text);
      font-family: "Avenir Next", "Helvetica Neue", Helvetica, Arial, sans-serif;
    }
    .page {
      max-width: 1160px;
      margin: 18px auto;
      border: 1px solid var(--line);
      background: #eef3fa;
      box-shadow: 0 8px 26px rgba(17, 40, 67, 0.10);
    }
    .header {
      padding: 14px 14px 8px;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 14px;
      align-items: end;
      background: linear-gradient(180deg, #edf3fb 0%, #e7eff9 100%);
    }
    h1 { margin: 0; font-size: 36px; line-height: 1; letter-spacing: -0.02em; }
    .subtitle { margin-top: 4px; color: var(--accent); font-size: 18px; font-weight: 700; }
    .hint {
      color: var(--muted);
      font-size: 13px;
      text-align: right;
      max-width: 460px;
      line-height: 1.4;
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 320px;
      min-height: 760px;
    }
    .panel {
      border-right: 1px solid var(--line);
      position: relative;
      overflow: hidden;
      background: #d7deea;
    }
    #chart { width: 100%; height: 100%; min-height: 760px; }
    .side {
      display: flex;
      flex-direction: column;
      background: linear-gradient(180deg, #e8eff9 0%, #e0e9f5 100%);
    }
    .card {
      margin: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255,255,255,0.72);
      box-shadow: 0 4px 14px rgba(17, 40, 67, 0.06);
      padding: 10px 12px;
    }
    .card h3 { margin: 0 0 8px; font-size: 14px; color: #334155; }
    .info-row { margin: 5px 0; font-size: 13px; color: #1f2937; line-height: 1.35; }
    .muted { color: #64748b; }
    .control-label {
      display: block;
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: #475569;
      text-transform: uppercase;
    }
    .filter-select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #c7d2e2;
      border-radius: 8px;
      background: #fbfdff;
      color: #1f2937;
      font-size: 14px;
      outline: none;
    }
    .filter-select:focus {
      border-color: #2c6fb3;
      box-shadow: 0 0 0 3px rgba(44, 111, 179, 0.15);
    }
    .summary {
      margin-top: 8px;
      font-size: 12px;
      color: #5f6b7a;
      line-height: 1.4;
    }
    @media (max-width: 980px) {
      .layout { grid-template-columns: 1fr; }
      .panel { border-right: none; border-bottom: 1px solid var(--line); }
    }
  </style>
</head>

        <div class="card">
          <h3>Point Details</h3>
          <div id="info" class="muted">Hover or click a point.</div>
        </div>
      </div>
    </div>
  </div>

    const colors = {
      "Dairy": "#5B2C8D",
      "Vegetables": "#006400",
      "Meat/Fish": "#CC4400",
      "Bread/Grains": "#0047AB"
    };

    const groups = ["Dairy", "Vegetables", "Meat/Fish", "Bread/Grains"];
    const traces = groups.map(group => {
      const g = rows.filter(r => r.group === group);
      return {
        type: "scattergl",
        mode: "markers",
        name: group,
        x: g.map(r => r.calories),
        y: g.map(r => r.ratio),
        customdata: g.map(r => [r.product, r.category, r.group, r.brand, r.calories, r.sodium, r.ratio]),
        marker: {
          size: 5,
          color: colors[group],
          opacity: 0.98,
          line: { color: colors[group], width: 0.4 }
        },
        hoverinfo: "none" // no duplicated floating tooltip near points
      };
    });

    const maxX = Math.max(...rows.map(r => r.calories), 600);
    const maxY = Math.max(...rows.map(r => r.ratio), 0);
    const ALL_GROUPS = "__ALL__";

    // offsets so points near 0 are not clipped
    const X_MIN = -10;
    const Y_MIN = -0.75;

    // show all ratios (including max like 38)
    const X_MAX = Math.min(600, Math.ceil(maxX / 10) * 10);
    const Y_MAX = Math.ceil(maxY) + 1;
    const MIN_X_WINDOW = 30;
    const MIN_Y_WINDOW = 0.8;
    let currentBounds = { xMin: X_MIN, xMax: X_MAX, yMin: Y_MIN, yMax: Y_MAX };
    let isApplyingZoomClamp = false;

    function rowsForGroup(selectedGroup) {
      return selectedGroup === ALL_GROUPS
        ? rows
        : rows.filter(r => r.group === selectedGroup);
    }

    function axisBoundsForGroup(selectedGroup) {
      const subset = rowsForGroup(selectedGroup);
      const subsetMaxX = Math.max(...subset.map(r => r.calories), 80);
      const subsetMaxY = Math.max(...subset.map(r => r.ratio), 0);
      return {
        xMin: X_MIN,
        yMin: Y_MIN,
        xMax: selectedGroup === ALL_GROUPS ? X_MAX : Math.min(600, Math.ceil((subsetMaxX * 1.12) / 10) * 10),
        yMax: selectedGroup === ALL_GROUPS ? Y_MAX : Math.max(3, Math.ceil(subsetMaxY) + 1)
      };
    }

    function buildReferenceLines(xMin, xMax) {
      return [1, 3, 5].map(v => ({
        type: "line",
        xref: "x", yref: "y",
        x0: xMin, x1: xMax,
        y0: v, y1: v,
        layer: "below",
        line: { color: "#ffffff", width: 2 }
      }));
    }

    function clampAxisRange(start, end, minBound, maxBound, minWindow) {
      let a = Math.min(start, end);
      let b = Math.max(start, end);

      if ((b - a) < minWindow) {
        const center = (a + b) / 2;
        a = center - (minWindow / 2);
        b = center + (minWindow / 2);
      }

      if (a < minBound) {
        b += (minBound - a);
        a = minBound;
      }

      if (b > maxBound) {
        a -= (b - maxBound);
        b = maxBound;
      }

      a = Math.max(a, minBound);
      b = Math.min(b, maxBound);

      if ((b - a) < minWindow) {
        a = minBound;
        b = Math.min(maxBound, minBound + minWindow);
      }

      return [a, b];
    }

        <div class="info-row"><b>Brand:</b> ${d[3]}</div>
        <div class="info-row"><b>Calories:</b> ${Number(d[4]).toFixed(1)} kcal</div>
        <div class="info-row"><b>Sodium:</b> ${Number(d[5]).toFixed(1)} mg</div>
        <div class="info-row"><b>Ratio:</b> ${Number(d[6]).toFixed(2)} mg/kcal</div>
      `;
    }

    function applyGroupFilter(selectedGroup) {
      const visibleMask = groups.map(group => selectedGroup === ALL_GROUPS || group === selectedGroup);
      const bounds = axisBoundsForGroup(selectedGroup);
      currentBounds = bounds;
      Plotly.restyle(chart, { visible: visibleMask }, groups.map((_, idx) => idx));
      Plotly.relayout(chart, {
        "xaxis.range": [bounds.xMin, bounds.xMax],
        "yaxis.range": [bounds.yMin, bounds.yMax],
        shapes: buildReferenceLines(bounds.xMin, bounds.xMax)
      });
      setSummary(selectedGroup);
      setDefaultInfo(selectedGroup);
    }

    const chart = document.getElementById("chart");
    chart.on("plotly_hover", ev => setInfo(ev.points[0]));
    chart.on("plotly_click", ev => setInfo(ev.points[0]));
    chart.on("plotly_relayout", ev => {
      if (isApplyingZoomClamp) return;

      const wantsReset =
        ev["xaxis.autorange"] ||
        ev["yaxis.autorange"];

      if (wantsReset) {
        isApplyingZoomClamp = true;
        Plotly.relayout(chart, {
          "xaxis.range": [currentBounds.xMin, currentBounds.xMax],
          "yaxis.range": [currentBounds.yMin, currentBounds.yMax],
          shapes: buildReferenceLines(currentBounds.xMin, currentBounds.xMax)
        }).finally(() => {
          isApplyingZoomClamp = false;
        });
        return;
      }

      const hasXRange =
        ev["xaxis.range[0]"] !== undefined &&
        ev["xaxis.range[1]"] !== undefined;
      const hasYRange =
        ev["yaxis.range[0]"] !== undefined &&
        ev["yaxis.range[1]"] !== undefined;

      if (!hasXRange && !hasYRange) return;

      const nextX = hasXRange
        ? clampAxisRange(
            ev["xaxis.range[0]"],
            ev["xaxis.range[1]"],
            currentBounds.xMin,
            currentBounds.xMax,
            MIN_X_WINDOW
          )
        : null;

      const nextY = hasYRange
        ? clampAxisRange(
            ev["yaxis.range[0]"],
            ev["yaxis.range[1]"],
            currentBounds.yMin,
            currentBounds.yMax,
            MIN_Y_WINDOW
          )
        : null;

      const xChanged = hasXRange &&
        (Math.abs(nextX[0] - ev["xaxis.range[0]"]) > 1e-9 ||
         Math.abs(nextX[1] - ev["xaxis.range[1]"]) > 1e-9);
      const yChanged = hasYRange &&
        (Math.abs(nextY[0] - ev["yaxis.range[0]"]) > 1e-9 ||
         Math.abs(nextY[1] - ev["yaxis.range[1]"]) > 1e-9);

      if (!xChanged && !yChanged) return;

      const relayoutUpdate = {};
      if (xChanged) relayoutUpdate["xaxis.range"] = nextX;
      if (yChanged) relayoutUpdate["yaxis.range"] = nextY;
      if (xChanged) relayoutUpdate["shapes"] = buildReferenceLines(nextX[0], nextX[1]);

      isApplyingZoomClamp = true;
      Plotly.relayout(chart, relayoutUpdate).finally(() => {
        isApplyingZoomClamp = false;
      });
    });
    filterEl.addEventListener("change", ev => applyGroupFilter(ev.target.value));

    setSummary(ALL_GROUPS);
    setDefaultInfo(ALL_GROUPS);
  </script>
</body>
</html>
